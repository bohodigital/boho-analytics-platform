schema_version: "2.1"
fixture_id: public_graph_evidence_core21
description: Synthetic analyzer-independent contract for Graph Evidence Core 2.1.
site:
  origin: https://graph-core21.example
  repository_revision: aaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaaa
  deployment_revision: bbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbbb
  analyzer_independent: true
routes:
  - id: about
    path: /about/
    canonical_path: /about/
    goal: false
  - id: about_alias
    path: /about-us/
    canonical_path: /about/
    goal: false
  - id: article_alpha
    path: /articles/alpha/
    canonical_path: /articles/alpha/
    goal: false
  - id: article_beta
    path: /articles/beta/
    canonical_path: /articles/beta/
    goal: false
  - id: contact
    path: /contact/
    canonical_path: /contact/
    goal: true
  - id: gateway
    path: /start/
    canonical_path: /start/
    goal: false
  - id: healthy_a
    path: /learn/a/
    canonical_path: /learn/a/
    goal: false
  - id: healthy_b
    path: /learn/b/
    canonical_path: /learn/b/
    goal: false
  - id: home
    path: /
    canonical_path: /
    goal: false
  - id: pricing
    path: /pricing/
    canonical_path: /pricing/
    goal: false
  - id: resources
    path: /resources/
