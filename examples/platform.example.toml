schema_version = 2

[platform]
default_timezone = "UTC"
state_path = "../var/analytics.sqlite3"
default_sync_days = 30
http_timeout_seconds = 30
max_response_bytes = 5000000

[web]
bind_host = "127.0.0.1"
port = 8787
allowed_hosts = ["127.0.0.1", "localhost"]
auth_mode = "none"

[retention]
hourly_days = 90
daily_days = 1095

[[clients]]
id = "example-client"
name = "Example Client"

[[sites]]
id = "example-site"
client_id = "example-client"
name = "Example Site"
canonical_url = "https://example.com"
timezone = "UTC"

[[connections]]
id = "example-umami"
provider = "umami"
credential_ref = "env:UMAMI_REPORTING_CREDENTIAL"
[connections.options]
base_url = "https://analytics.example.com"

[[connections]]
id = "example-cloudflare"
provider = "cloudflare"
credential_ref = "env:CLOUDFLARE_ANALYTICS_CREDENTIAL"

[[connections]]
id = "example-google"
provider = "google-analytics"
credential_ref = "env:GOOGLE_ANALYTICS_CREDENTIAL"

[[connections]]
id = "example-search"
provider = "search-console"
credential_ref = "env:GOOGLE_SEARCH_CONSOLE_CREDENTIAL"

[[connections]]
id = "example-forms"
provider = "cloudflare-forms"
credential_ref = "env:CLOUDFLARE_FORMS_READ_CREDENTIAL"
[connections.options]
account_id = "replace-with-account-id"
database_id = "replace-with-d1-database-id"
source_retention_days = 90

[[connections]]
id = "example-forms-inbox"
provider = "forms-inbox"
credential_ref = "none:local-read-only"
[connections.options]
database_path = "/path/to/read-only/mail.db"

[[bindings]]
site_id = "example-site"
connection_id = "example-umami"
resource_type = "website"
resource_id = "replace-with-umami-website-id"
metric_groups = ["traffic"]
[bindings.options]
# First site-local date on which this tracker is independently known active.
observation_start = "2026-01-01"
[bindings.options.route_analytics]
enabled = false
# Optional dimension families remain off unless named here.
# Use ["all"] for every supported privacy-safe expanded aggregate, or list a subset.
# umami_dimensions = ["all"]
# umami_event_names = ["demo-request"]

[[bindings]]
site_id = "example-site"
connection_id = "example-cloudflare"
resource_type = "zone"
resource_id = "replace-with-cloudflare-zone-tag"
metric_groups = ["traffic"]

[[bindings]]
site_id = "example-site"
connection_id = "example-google"
resource_type = "property"
resource_id = "replace-with-ga4-property-id"
metric_groups = ["traffic"]
[bindings.options.route_analytics]
# Disabled unless explicitly changed to true after validating provider scope and privacy policy.
enabled = false
# max_days = 31
# page_size = 1000
# max_pages = 25
# allowed_query_parameters = ["variant"]
# excluded_routes = ["/private"]
# approved_referrer_domains = ["www.google.com"]
# Optional dimension families remain off unless named here.
# ga4_dimensions = ["title", "channel", "referrer"]
# ga4_event_names = ["demo-request"]

[[bindings]]
site_id = "example-site"
connection_id = "example-search"
resource_type = "site"
resource_id = "sc-domain:example.com"
metric_groups = ["search"]
[bindings.options.route_analytics]
enabled = false
# Search Console defaults to page_size=25000 and max_pages=3 when both are omitted,
# allowing two full result pages plus the terminal empty exhaustion call.
# Select one surface, or use search_types = ["all"] for web, image, video,
# News, Discover, and Google News as separate fact/provenance scopes.
# search_type = "web"
# search_types = ["all"]
# search_console_dimensions = ["all"]
# Store privacy-screened query wording; unsafe values collapse into one redacted bucket.
# search_console_query_text = false
# Add page/query combinations. Requires search_console_query_text = true.
# search_console_page_query = false
# Add Search Console's recent hourly_all provisional feed (provider lookback is ten days).
# search_console_hourly = false
# query_clusters = { brand = "example" }

[[bindings]]
site_id = "example-site"
connection_id = "example-forms"
resource_type = "forms-site"
resource_id = "replace-with-worker-site-id"
metric_groups = ["forms"]

[[bindings]]
site_id = "example-site"
connection_id = "example-forms-inbox"
resource_type = "mailbox"
resource_id = "replace-with-mailbox-key"
metric_groups = ["forms"]
[bindings.options]
mailbox_key = "replace-with-mailbox-key"
sender_contains = "forms-sender.example"
subject_contains = "Form submission"
subject_excludes = ["Synthetic monitoring"]
# First site-local date on which this mail index is independently known complete.
observation_start = "2026-01-01"

[[reports]]
id = "summary"
title = "Website summary"
client_id = "example-client"
site_ids = ["example-site"]
metric_ids = ["umami.pageviews", "umami.daily-visitors", "cloudflare.requests", "google.active-users", "search.clicks", "forms.submissions", "forms.inbox-deliveries", "forms.pending", "forms.failed"]
default_window_days = 7
# Default views stop before provider-finalization lag. Explicit start/end queries are unchanged.
default_end_lag_days = 1

[[reports.subreports]]
id = "forms"
title = "Forms delivery"
metric_ids = ["forms.submissions", "forms.sent", "forms.pending", "forms.failed", "forms.inbox-deliveries", "forms.inbox-unread"]
default_window_days = 30
# Optional dimension filters make form-specific subreports possible.
[reports.subreports.filters]
form_id = "contact"

[[reports.subreports]]
id = "search"
title = "Google Search Console"
metric_ids = ["search.clicks", "search.impressions", "search.ctr", "search.position"]
default_window_days = 90
