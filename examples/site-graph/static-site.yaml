schema_version: 1
site:
  key: example-site
  display_name: Example Site
  canonical_hosts:
    - example.com
repository:
  local_path: /opt/example-site
  expected_remote: https://github.com/example/example-site.git
  ref: main
  expected_commit: null
  require_clean: true
analysis:
  mode: source-only
  adapter: static-html
  include_drafts: false
  maximum_pages: 5000
build:
  enabled: false
  adapter_command: null
  output_directory: null
cloudflare_pages:
  enabled: false
  account_id_ref: null
  project_name: null
  expected_production_branch: null
routes:
  include:
    - /**
  exclude:
    - /admin/**
canonicalization:
  normalize_trailing_slash: true
  strip_fragments: true
  remove_query_parameters: true
page_rules:
  - id: homepage
    path_regex: ^/$
    roles: [homepage]
    journey_stage: 1
  - id: service
    path_regex: ^/services/
    roles: [service]
    journey_stage: 3
link_layers:
  explicit_attribute: data-link-layer
  selectors:
    menu: [header nav a]
    breadcrumb: ['[aria-label="Breadcrumb"] a']
    contextual: [main article a]
    related: ['[data-related-content] a']
    action: ['[data-cta] a']
    utility: [footer a]
goals:
  - id: contact-page
    kind: page
    paths: [/contact/]
  - id: service-role
    kind: role
    roles: [service]
