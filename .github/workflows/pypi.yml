name: publish to PyPI

on:
  workflow_dispatch:
    inputs:
      tag:
        description: Existing final release tag to build and publish (for example, v0.2.0)
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: pypi-${{ inputs.tag }}
  cancel-in-progress: false

jobs:
  build:
    name: build and verify distributions
    runs-on: ubuntu-latest
    steps:
      - name: Check out the requested tag
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          fetch-depth: 1
          persist-credentials: false
          ref: refs/tags/${{ inputs.tag }}
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: "3.13"
      - name: Verify the tag and package version
        env:
          RELEASE_TAG: ${{ inputs.tag }}
        shell: bash
        run: |
          set -euo pipefail
          if [[ ! "$RELEASE_TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Only final SemVer tags such as v0.2.0 may be published" >&2
            exit 1
          fi
          git tag --points-at HEAD | grep -Fx -- "$RELEASE_TAG"
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "v$PACKAGE_VERSION" = "$RELEASE_TAG"
      - name: Install project and packaging tools
        run: python -m pip install --disable-pip-version-check . "build>=1.2,<2" "twine>=6,<7"
      - name: Verify the publication boundary
        shell: bash
        run: |
          set -euo pipefail
          if git ls-files | grep -E '(^|/)(tests?|audits?|plans?)(/|$)'; then
            echo "Internal validation material is not allowed in the public tree" >&2
            exit 1
          fi
          python - <<'PY'
          from pathlib import Path
          import subprocess

          needles = (
              "C:" + "\\Users" + "\\",
              "/srv/" + "local1/",
              "bohopi" + "@",
              "W" + "O-",
              "C" + "R-",
          )
          findings = []
          tracked = subprocess.check_output(["git", "ls-files", "-z"]).split(b"\0")
          for raw_path in tracked:
              if not raw_path:
                  continue
              path = Path(raw_path.decode())
              try:
                  content = path.read_text(encoding="utf-8")
              except (UnicodeDecodeError, OSError):
                  continue
              for line_number, line in enumerate(content.splitlines(), start=1):
                  if any(needle in line for needle in needles):
                      findings.append(f"{path}:{line_number}")
          if findings:
              raise SystemExit(
                  "Machine-specific or internal coordination content found:\n"
                  + "\n".join(findings)
              )
          PY
      - name: Compile public source
        run: python -m compileall -q src
      - name: Build source and wheel distributions
        run: python -m build
      - name: Check distribution metadata
        run: python -m twine check --strict dist/*
      - name: Smoke-test the built wheel
        shell: bash
        run: |
          set -euo pipefail
          python -m venv "$RUNNER_TEMP/package-smoke"
          "$RUNNER_TEMP/package-smoke/bin/python" -m pip install --disable-pip-version-check dist/*.whl
          PACKAGE_VERSION="$(python -c 'import tomllib; print(tomllib.load(open("pyproject.toml", "rb"))["project"]["version"])')"
          test "$("$RUNNER_TEMP/package-smoke/bin/boho-analytics" --version)" = "boho-analytics $PACKAGE_VERSION"
      - name: Store verified distributions
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5
        with:
          name: python-package-distributions
          path: dist/
          if-no-files-found: error
          retention-days: 1

  publish:
    name: publish verified distributions
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: pypi
      url: https://pypi.org/p/boho-analytics-platform
    permissions:
      id-token: write
    steps:
      - name: Retrieve verified distributions
        uses: actions/download-artifact@018cc2cf5baa6db3ef3c5f8a56943fffe632ef53 # v6
        with:
          name: python-package-distributions
          path: dist/
      - name: Publish with PyPI Trusted Publishing
        uses: pypa/gh-action-pypi-publish@cef221092ed1bacb1cc03d23a2d87d1d172e277b # release/v1
        with:
          packages-dir: dist/
          print-hash: true
