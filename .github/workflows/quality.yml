name: quality

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.11", "3.12", "3.13", "3.14"]
    env:
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          persist-credentials: false
      - name: Set up Python
        uses: actions/setup-python@ece7cb06caefa5fff74198d8649806c4678c61a1 # v6
        with:
          python-version: ${{ matrix.python-version }}
      - name: Verify public tree
        run: python scripts/verify_release.py
      - name: Install package
        run: python -m pip install --disable-pip-version-check --editable .
      - name: Run unit tests
        run: python -m unittest discover -s tests -v
      - name: Exercise CLI
        run: |
          boho-analytics --version
          boho-analytics config validate examples/platform.example.toml
      - name: Build wheel
        run: python -m pip wheel . --no-deps --wheel-dir "${RUNNER_TEMP}/wheels"
